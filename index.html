<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BENCHED &mdash; A Striker's Roguelite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23d6ff3f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <!-- WebGL rendering zone -->
  <canvas id="pitch"></canvas>

  <!-- SIMULATING dimmer. Cleared instantly when a highlight fires. -->
  <div id="dim"></div>

  <!-- In-match HUD -->
  <div id="hud" class="hidden">
    <div class="hud-bar hud-top">
      <span id="hud-left">MATCH 1 | CLOCK: 0'</span>
      <span id="hud-right">GOALS: 0 | CHANCES LEFT: 3</span>
    </div>

    <div id="phase-prompt" class="phase-prompt"></div>
    <div id="verdict" class="verdict"></div>

    <div class="hud-bottom">
      <div id="ticker" class="ticker"></div>
      <div id="powerwrap" class="powerwrap hidden">
        <div class="powerbar"><div id="powerfill"></div></div>
      </div>
    </div>
  </div>

  <!-- Overlay screens: main menu, training room, benched -->
  <div id="overlay" class="hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
